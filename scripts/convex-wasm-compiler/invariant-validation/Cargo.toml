[package]
name = "convex-wasm-compiler-invariant-validation"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = ["invariant-validation"]
invariant-validation = ["dep:libfuzzer-sys"]

[dependencies]
anyhow = "=1.0.100"
hex = "=0.4.3"
libc = "=0.2.189"
libfuzzer-sys = { version = "=0.4.13", optional = true }
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", rev = "71c628af95bf69723b5cdabe10142f168562f2e7" }
oxc_ast = { git = "https://github.com/oxc-project/oxc.git", rev = "71c628af95bf69723b5cdabe10142f168562f2e7", features = ["serialize"] }
oxc_codegen = { git = "https://github.com/oxc-project/oxc.git", rev = "71c628af95bf69723b5cdabe10142f168562f2e7" }
oxc_cfg = { git = "https://github.com/oxc-project/oxc.git", rev = "71c628af95bf69723b5cdabe10142f168562f2e7" }
oxc_parser = { git = "https://github.com/oxc-project/oxc.git", rev = "71c628af95bf69723b5cdabe10142f168562f2e7", features = ["regular_expression"] }
oxc_semantic = { git = "https://github.com/oxc-project/oxc.git", rev = "71c628af95bf69723b5cdabe10142f168562f2e7", features = ["cfg"] }
oxc_span = { git = "https://github.com/oxc-project/oxc.git", rev = "71c628af95bf69723b5cdabe10142f168562f2e7" }
oxc_transformer = { git = "https://github.com/oxc-project/oxc.git", rev = "71c628af95bf69723b5cdabe10142f168562f2e7" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "compiler_frontend"
path = "invariant_validation_targets/compiler_frontend.rs"
test = false
doc = false
bench = false
required-features = ["invariant-validation"]

[[bin]]
name = "corpus-driver"
path = "src/corpus_driver.rs"
test = false
doc = false
bench = false
