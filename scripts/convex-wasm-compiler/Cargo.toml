[package]
name = "convex-wasm-compiler"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.100"
hex = "=0.4.3"
libc = "=0.2.189"
oxc_allocator = { git = "https://github.com/oxc-project/oxc.git", rev = "f32360093c2ee18096fa14e0f48c48d75ca5a4a4" }
oxc_ast = { git = "https://github.com/oxc-project/oxc.git", rev = "f32360093c2ee18096fa14e0f48c48d75ca5a4a4", features = ["serialize"] }
oxc_codegen = { git = "https://github.com/oxc-project/oxc.git", rev = "f32360093c2ee18096fa14e0f48c48d75ca5a4a4" }
oxc_cfg = { git = "https://github.com/oxc-project/oxc.git", rev = "f32360093c2ee18096fa14e0f48c48d75ca5a4a4" }
oxc_parser = { git = "https://github.com/oxc-project/oxc.git", rev = "f32360093c2ee18096fa14e0f48c48d75ca5a4a4", features = ["regular_expression"] }
oxc_semantic = { git = "https://github.com/oxc-project/oxc.git", rev = "f32360093c2ee18096fa14e0f48c48d75ca5a4a4", features = ["cfg"] }
oxc_span = { git = "https://github.com/oxc-project/oxc.git", rev = "f32360093c2ee18096fa14e0f48c48d75ca5a4a4" }
oxc_transformer = { git = "https://github.com/oxc-project/oxc.git", rev = "f32360093c2ee18096fa14e0f48c48d75ca5a4a4" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
strip = "debuginfo"
