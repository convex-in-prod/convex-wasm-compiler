name: Publish native release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install compiler toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build and verify native release
        run: >-
          node scripts/build-native-release.mjs
          --output artifact
          --target "${{ matrix.target }}"
          --jobs 2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: convex-wasm-native-${{ matrix.target }}
          path: artifact
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: convex-wasm-native-*
          merge-multiple: false
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          for directory in convex-wasm-native-*; do
            target=${directory#convex-wasm-native-}
            cp "$directory/index.json" "release-assets/${target}-index.json"
            cp "$directory/evidence.json" "release-assets/${target}-evidence.json"
            for kind in compiler precompiler; do
              package_directory=$(find "$directory/packages/$kind/$target" -mindepth 1 -maxdepth 1 -type d -print)
              test "$(printf '%s\n' "$package_directory" | wc -l)" -eq 1
              package_id=${package_directory##*/}
              binary_name=convex-wasm-$kind
              cp "$package_directory/manifest.json" \
                "release-assets/${target}-${kind}-${package_id}-manifest.json"
              cp "$package_directory/bin/$binary_name" \
                "release-assets/${target}-${kind}-${package_id}"
            done
          done
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes release-assets/*
