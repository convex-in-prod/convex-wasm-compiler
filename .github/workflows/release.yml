name: Publish native release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful Native release binaries run to publish
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event_name == 'push'
    uses: ./.github/workflows/native.yml

  publish:
    name: Publish release assets
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Select validated build
        id: validated
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID" > "$RUNNER_TEMP/native-run.json"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/native-jobs.json"
            node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const run = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/native-run.json`, 'utf8'));
          // Publish the exact source and artifacts that passed every platform,
          // including WSL2. A newer main commit must not change that provenance.
          if (run.status !== 'completed' || run.conclusion !== 'success' ||
              run.path !== '.github/workflows/native.yml' || run.event !== 'workflow_dispatch' ||
              run.head_branch !== 'main' || run.head_repository.full_name !== process.env.GITHUB_REPOSITORY ||
              !/^[0-9a-f]{40}$/.test(run.head_sha)) {
            throw new Error('Release requires a successful main-branch native workflow run');
          }
          // Older successful runs may predate a required platform check.
          const jobs = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/native-jobs.json`, 'utf8'));
          const platforms = ['x86_64-unknown-linux-gnu', 'aarch64-apple-darwin',
            'x86_64-apple-darwin', 'Windows x64 WSL2 installation'];
          if (jobs.total_count !== platforms.length || jobs.jobs.length !== platforms.length ||
              !platforms.every(name => jobs.jobs.some(job => job.name === name && job.conclusion === 'success'))) {
            throw new Error('Release requires successful Linux, both macOS, and Windows WSL2 jobs');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `revision=${run.head_sha}\nrun_id=${run.id}\n`);
          JS
          else
            echo "revision=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.validated.outputs.revision }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: convex-wasm-native-*
          merge-multiple: false
          run-id: ${{ steps.validated.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Select release tag
        env:
          RELEASE_REVISION: ${{ steps.validated.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "$release_tag"
          fi
          git ls-remote --tags origin "refs/tags/$release_tag" "refs/tags/$release_tag^{}" > "$RUNNER_TEMP/release-tag"
          if [ -s "$RUNNER_TEMP/release-tag" ]; then
            # ls-remote emits an annotated tag's peeled commit after its tag object.
            test "$(tail -1 "$RUNNER_TEMP/release-tag" | cut -f1)" = "$RELEASE_REVISION"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          for directory in convex-wasm-native-*; do
            target=${directory#convex-wasm-native-}
            cp "$directory"/toolchain/*.tar.gz "$directory"/toolchain/*.sha256 release-assets/
            cp "$directory/toolchain/smoke.json" "release-assets/${target}-toolchain-smoke.json"
            cp "$directory/index.json" "release-assets/${target}-index.json"
            cp "$directory/evidence.json" "release-assets/${target}-evidence.json"
            for kind in compiler precompiler; do
              package_directory=$(find "$directory/packages/$kind/$target" -mindepth 1 -maxdepth 1 -type d -print)
              test "$(printf '%s\n' "$package_directory" | wc -l)" -eq 1
              package_id=${package_directory##*/}
              binary_name=convex-wasm-$kind
              cp "$package_directory/manifest.json" \
                "release-assets/${target}-${kind}-${package_id}-manifest.json"
              cp "$package_directory/bin/$binary_name" \
                "release-assets/${target}-${kind}-${package_id}"
            done
          done
          cp convex-wasm-native-x86_64-unknown-linux-gnu/wsl2/* release-assets/
          node scripts/create-native-package-selection.mjs \
            --assets-root release-assets \
            --output release-assets/native-package-selection.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG"
      - name: Package installable JavaScript toolchain
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$package_version"
          cp release-assets/native-package-selection.json scripts/native-package-selection.json
          npm pack --pack-destination release-assets --quiet
          package_filename="convex-wasm-compiler-$package_version.tgz"
          package_archive="$PWD/release-assets/$package_filename"
          test -f "$package_archive"
          sdk_package=$(node -p "require('./package.json').devDependencies.convex")
          npm install --prefix "$RUNNER_TEMP/convex-wasm-package" \
            --omit=dev --no-save "$package_archive" "$sdk_package"
          package_root="$RUNNER_TEMP/convex-wasm-package/node_modules/convex-wasm-compiler"
          cmp release-assets/native-package-selection.json "$package_root/scripts/native-package-selection.json"
          for required in docs/runtime-compatibility.md docs/memory-reclamation.md docs/guest-memory-maintenance.md scripts/build-wasm-allocator.py scripts/lib/convex-wasm-allocator.h scripts/lib/convex-wasm-allocator.c scripts/vendor/convex-wasm-native-intl/ADAPTER-LICENSE.txt scripts/vendor/convex-wasm-native-intl/ICU-LICENSE.txt scripts/test-fixtures/native-values/resource-probe.cpp scripts/test-fixtures/convex-wasm-request-envelope/report-fixture.mjs; do
            test -s "$package_root/$required"
          done
          for command in convex-wasm-build convex-wasm-backend-report convex-wasm-authority convex-wasm-bind convex-wasm-acquire-native convex-wasm-setup-gate convex-wasm-cache convex-wasm-publish-registry convex-wasm-transfer-registry; do
            test -x "$RUNNER_TEMP/convex-wasm-package/node_modules/.bin/$command"
            if "$RUNNER_TEMP/convex-wasm-package/node_modules/.bin/$command" --invalid-option >"$RUNNER_TEMP/$command.stdout" 2>"$RUNNER_TEMP/$command.stderr"; then
              echo "Installed command did not reject an invalid option: $command" >&2
              exit 1
            fi
          done
          PACKAGE_ROOT="$package_root" node --input-type=module -e '
            const root = process.env.PACKAGE_ROOT;
            await Promise.all([
              import(`${root}/scripts/build-convex-wasm.mjs`),
              import(`${root}/scripts/backend-report.mjs`),
              import(`${root}/scripts/authority-project.mjs`),
              import(`${root}/scripts/bind-convex-wasm.mjs`),
              import(`${root}/scripts/plan-registry-transfer.mjs`),
              import(`${root}/scripts/publish-registry.mjs`),
            ]);
          '
          (cd release-assets && sha256sum "$package_filename" >"$package_filename.sha256")
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ steps.validated.outputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--target "$RELEASE_REVISION")
          if [ "$GITHUB_EVENT_NAME" = push ]; then options+=(--verify-tag); fi
          gh release create "$RELEASE_TAG" "${options[@]}" --generate-notes release-assets/*
