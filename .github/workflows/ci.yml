name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install compiler toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Check release tooling
        run: npm run check:js
      - name: Test compiler
        run: cargo test --locked --manifest-path scripts/convex-wasm-compiler/Cargo.toml
      - name: Test precompiler
        run: cargo test --locked --manifest-path scripts/convex-wasm-precompiler/Cargo.toml
      - name: Test invariant validation
        run: cargo test --locked --manifest-path scripts/convex-wasm-compiler/invariant-validation/Cargo.toml
